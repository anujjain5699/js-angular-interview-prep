name: Test JavaScript Solutions

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-tests:
    name: Run All JS Files & Validations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (Latest LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Execute all JS solutions
        run: |
          echo "🚀 Executing all JavaScript files to verify syntax and tests..."
          for file in *.js; do
            if [ "$file" != "update_readme.js" ]; then
              echo "▶️ Testing $file..."
              node "$file"
            fi
          done

      - name: Verify README update script
        run: |
          echo "📄 Verifying update_readme.js..."
          node update_readme.js
