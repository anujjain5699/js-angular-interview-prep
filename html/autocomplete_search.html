📌 Problem Statement:
Build a performant, accessible Autocomplete Search Box in Vanilla JavaScript that
fetches real-time matching suggestions as the user types and handles dropdown states.

🎯 Core Requirements & Test Contracts:
1. Fetch on Input (2+ chars):
   - Listen to input events on `data-testid="autocomplete-input"`.
   - When input length >= 2, fetch suggestions from API and render up to 3 items.
   - Each suggestion must have `data-testid="suggestion"`.
   - If input length < 2, collapse/remove dropdown from DOM.

2. Selection & Auto-Fill:
   - Clicking any suggestion populates the input with the item's title and closes dropdown.

3. Outside Click Dismissal:
   - Clicking anywhere outside `#root` / `#dropdown` closes the suggestion list.

💡 Key Concepts & Patterns Covered:
- DOM Event Delegation (`e.target.closest('[data-testid="suggestion"]')`)
- Outside Click Listener (`!element.contains(e.target)`)
- Clean DOM lifecycle (Mount/Unmount via `innerHTML = ''`)
- Asynchronous API integration via `async/await` and `fetch()`
===================================================================================

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autocomplete Search Box - Vanilla JavaScript</title>
</head>

<body>
    <div id="root">
        <input type="text" data-testid="autocomplete-input" placeholder="Search products...">
        <div id="dropdown"></div>
    </div>

    <script>
        const root = document.getElementById('root')
        const inputValue = document.querySelector('[data-testid="autocomplete-input"]')
        const dropdown = document.getElementById('dropdown')

        async function fetchSuggestions(searchText) {
            const response = await fetch(`https://dummyjson.com/products/search?q=${searchText}`)
            const result = await response.json()
            let data = (result.products || []).slice(0, 3)
            renderUI(data)
        }

        function renderUI(data) {
            dropdown.innerHTML = ''
            data.forEach(item => {
                const suggestion = document.createElement('div')
                suggestion.setAttribute('data-testid', 'suggestion')
                suggestion.textContent = item.title

                dropdown.appendChild(suggestion)
            })
        }

        function closeDropDown() {
            dropdown.innerHTML = ''
        }

        inputValue.addEventListener('input', (e) => {
            const value = e.target.value.trim()
            console.log('value', value)
            if (value.length >= 2) {
                fetchSuggestions(value)
            } else {
                closeDropDown()
            }
        })

        dropdown.addEventListener('click', (e) => {
            const suggestion = e.target.closest('[data-testid="suggestion"]')
            if (suggestion) {
                inputValue.value = suggestion.textContent
                closeDropDown()
            }
        })

        document.addEventListener('click', (e) => {
            if (!inputValue.contains(e.target) && !dropdown.contains(e.target)) {
                closeDropDown()
            }
        })

    </script>
</body>

</html>
