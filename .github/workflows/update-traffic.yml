name: Update Traffic Stats

on:
  schedule:
    - cron: '0 0 * * *' # Runs once daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-traffic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TRAFFIC_SECRET }}

      - name: Fetch GitHub Traffic & Update README
        run: |
          VIEWS=$(curl -s \
            -H "Authorization: token ${{ secrets.TRAFFIC_SECRET && secrets.TRAFFIC_SECRET || github.token }}" \
            "https://api.github.com/repos/anujjain5699/js-angular-interview-prep/traffic/views")

          TOTAL=$(echo "$VIEWS" | grep -o '"count":[0-9]*' | head -1 | grep -o '[0-9]*')
          UNIQUE=$(echo "$VIEWS" | grep -o '"uniques":[0-9]*' | head -1 | grep -o '[0-9]*')

          TODAY=$(date '+%Y-%m-%d')

          STATS="📊 **Repo Traffic** *(last 14 days, unique visitors only — updated $TODAY)*\n\n> 👁️ Total views: **$TOTAL** \&nbsp;|\&nbsp; 🧑 Unique visitors: **$UNIQUE**"

          perl -i -0pe "s|<!-- TRAFFIC-STATS:START -->.*?<!-- TRAFFIC-STATS:END -->|<!-- TRAFFIC-STATS:START -->\n$STATS\n<!-- TRAFFIC-STATS:END -->|s" README.md

      - name: Commit & Push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || (git commit -m "docs: update traffic stats [skip ci]" && git push)
