name: Update Traffic Stats

on:
  schedule:
    - cron: '0 0 * * *' # Runs once daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-traffic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TRAFFIC_SECRET }}

      - name: Fetch GitHub Traffic & Update README
        env:
          TRAFFIC_SECRET: ${{ secrets.TRAFFIC_SECRET }}
        run: |
          python3 << 'EOF'
          import subprocess
          import json
          import re
          from datetime import datetime
          import os

          token = os.environ.get('TRAFFIC_SECRET')
          
          # Fetch traffic data
          result = subprocess.run([
              'curl', '-s',
              '-H', f'Authorization: token {token}',
              'https://api.github.com/repos/anujjain5699/js-angular-interview-prep/traffic/views'
          ], capture_output=True, text=True)
          
          try:
              data = json.loads(result.stdout)
              total = sum(item.get('count', 0) for item in data)
              unique = sum(item.get('uniques', 0) for item in data)
          except:
              total = 0
              unique = 0
          
          today = datetime.now().strftime('%Y-%m-%d')
          stats = f"📊 **Repo Traffic** *(last 14 days, unique visitors only — updated {today})*\n\n> 👁️ Total views: **{total}** &nbsp;|&nbsp; 🧑 Unique visitors: **{unique}**"
          
          # Update README
          with open('README.md', 'r') as f:
              content = f.read()
          
          pattern = r'<!-- TRAFFIC-STATS:START -->.*?<!-- TRAFFIC-STATS:END -->'
          replacement = f'<!-- TRAFFIC-STATS:START -->\n{stats}\n<!-- TRAFFIC-STATS:END -->'
          updated = re.sub(pattern, replacement, content, flags=re.DOTALL)
          
          with open('README.md', 'w') as f:
              f.write(updated)
          EOF

      - name: Commit & Push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || (git commit -m "docs: update traffic stats [skip ci]" && git push)
